<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07080B" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)" />
<title>404GB · Offline</title>
<link rel="icon" href="/icons/brand.svg" type="image/svg+xml" />
<style>
  /* Lumen tokens with system fonts: this page renders without the app's bundled assets. */
  :root {
    color-scheme: dark light;
    --bg: #07080B;
    --ink: #F4F6FA;
    --muted: #A0A7B6;
    --primary: #276DF6;
    --on-primary: #FFFFFF;
    --glow: rgb(39 109 246 / 0.16);
    --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F6F7F9;
      --ink: #0D0F14;
      --muted: #525968;
      --primary: #1660EB;
      --glow: rgb(22 96 235 / 0.1);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: calc(3rem + var(--safe-top)) 1.5rem calc(3rem + var(--safe-bottom));
    text-align: center;
  }
  .glow {
    position: absolute;
    z-index: -1;
    top: 14%;
    left: 50%;
    width: 20rem;
    height: 20rem;
    background: radial-gradient(closest-side, var(--glow), transparent);
    transform: translateX(-50%);
  }
  .mark {
    width: 4.5rem;
    height: 4.5rem;
    filter: drop-shadow(0 8px 24px rgb(22 96 235 / 0.28));
    animation: rise 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .copy { display: flex; flex-direction: column; gap: 0.75rem; max-width: 24rem; animation: rise 320ms 60ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .eyebrow {
    margin: 0;
    font-size: 0.8125rem;
    font-weight: 600;
    line-height: 1.2;
    color: var(--primary);
  }
  h1 { margin: 0; font-size: 1.75rem; line-height: 1.15; letter-spacing: -0.015em; font-weight: 700; }
  p { margin: 0; color: var(--muted); font-size: 0.9375rem; line-height: 1.5; }
  button {
    min-height: 3rem;
    padding: 0 1.5rem;
    border: 0;
    border-radius: 999px;
    background: var(--primary);
    color: var(--on-primary);
    font-family: inherit;
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 120ms cubic-bezier(0.16, 1, 0.3, 1), opacity 180ms;
    animation: rise 320ms 120ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <main>
    <div class="glow" aria-hidden="true"></div>
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="offline-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1660EB"/><stop offset="1" stop-color="#0A2878"/></linearGradient><radialGradient id="offline-sheen" cx="300" cy="140" r="820" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient><clipPath id="offline-front"><rect x="228" y="397" width="472" height="392" rx="84"/></clipPath></defs><rect width="1024" height="1024" rx="232" fill="url(#offline-bg)"/><rect width="1024" height="1024" rx="232" fill="url(#offline-sheen)"/><rect x="348" y="261" width="432" height="356" rx="76" transform="rotate(9 564 439)" fill="none" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="40"/><rect x="228" y="397" width="472" height="392" rx="84" fill="none" stroke="url(#offline-bg)" stroke-width="56"/><g clip-path="url(#offline-front)"><rect x="228" y="397" width="472" height="392" fill="#FFFFFF"/><path d="M228 789V712L372 584Q392 566 412 584L532 692L580 650Q598 634 616 650L700 724V789Z" fill="#1A5BE0"/><circle cx="582" cy="505" r="38" fill="#1A5BE0"/></g></svg>
    <div class="copy">
      <p class="eyebrow">Offline</p>
      <h1>You&rsquo;re offline</h1>
      <p>This screen isn&rsquo;t saved on your device yet. Reconnect and it will load. Uploads you started will pick up where they left off.</p>
    </div>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
