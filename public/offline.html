<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060609" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
<title>404GB · Offline</title>
<link rel="icon" href="/icons/brand.svg" type="image/svg+xml" />
<style>
  :root {
    color-scheme: dark light;
    --bg: #060609;
    --surface: #0f0f13;
    --border: #27272e;
    --ink: #fafafb;
    --muted: #a3a3ac;
    --accent: #818cf8;
    --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafb;
      --surface: #ffffff;
      --border: #e2e2e7;
      --ink: #18181b;
      --muted: #52525e;
      --accent: #6366f1;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: calc(3rem + var(--safe-top)) 1.5rem calc(3rem + var(--safe-bottom));
    text-align: center;
  }
  .glow {
    position: absolute;
    z-index: -1;
    top: 18%;
    left: 50%;
    width: 18rem;
    height: 18rem;
    border-radius: 9999px;
    background: rgb(129 140 248 / 0.25);
    filter: blur(72px);
    transform: translateX(-50%);
  }
  .mark {
    width: 4rem;
    height: 4rem;
    filter: drop-shadow(0 10px 28px rgb(99 102 241 / 0.4));
    animation: rise 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .copy { display: flex; flex-direction: column; gap: 0.5rem; max-width: 24rem; animation: rise 320ms 60ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .eyebrow {
    margin: 0;
    font: 600 0.8125rem/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.015em; font-weight: 700; }
  p { margin: 0; color: var(--muted); font-size: 0.9375rem; line-height: 1.55; }
  button {
    min-height: 2.75rem;
    padding: 0 1.25rem;
    border: 0;
    border-radius: 9999px;
    background: var(--ink);
    color: var(--bg);
    font-family: inherit;
    font-size: 0.8125rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), opacity 180ms;
    animation: rise 320ms 120ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <main>
    <div class="glow" aria-hidden="true"></div>
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="1024" height="1024" rx="224" fill="#060609"/><rect x="232" y="232" width="256" height="256" rx="64" fill="url(#g)"/><rect x="546" y="242" width="236" height="236" rx="56" fill="none" stroke="#818cf8" stroke-width="20" stroke-dasharray="40 28"/><rect x="232" y="536" width="256" height="256" rx="64" fill="url(#g)"/><rect x="536" y="536" width="256" height="256" rx="64" fill="url(#g)"/></svg>
    <div class="copy">
      <p class="eyebrow">Offline</p>
      <h1>You&rsquo;re offline</h1>
      <p>This screen isn&rsquo;t saved on your device yet. Reconnect and it will load. Uploads you started will pick up where they left off.</p>
    </div>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
