<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404GB — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 2rem;
    text-align: center;
  }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
  p { color: #a3a3a3; margin: 0; max-width: 26rem; }
  button {
    margin-top: 0.5rem;
    border-radius: 0.375rem;
    border: 1px solid #404040;
    background: transparent;
    color: #f5f5f5;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    cursor: pointer;
  }
  button:hover { color: #fff; border-color: #737373; }
</style>
</head>
<body>
  <main>
    <h1>404GB</h1>
    <p>You&rsquo;re offline. This page isn&rsquo;t cached yet — reconnect and try again.</p>
    <p>Anything you&rsquo;ve already viewed (gallery shell, recent thumbnails) may still work from other tabs.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
